[package]
name = "meerkat-fugue"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
default-run = "meerkat-fugue"
license = "MIT OR Apache-2.0"
description = "Meerkat-powered issue automation and persistent repository teams."
repository = "https://github.com/lukacf/meerkat-fugue"
readme = "README.md"
keywords = ["agents", "automation", "meerkat", "linear"]
categories = ["development-tools"]

[dependencies]
anyhow = "1.0"
async-stream = "0.3"
async-trait = "0.1"
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
futures = "0.3"
indexmap = { version = "2", features = ["serde"] }
meerkat-core = "=0.9.4"
meerkat-models = "=0.9.4"
meerkat-mob = "=0.9.4"
meerkat-meta = "=0.9.4"
meerkat-tools = "=0.9.4"
meerkat = { version = "=0.9.4", features = ["workgraph"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.37", features = ["bundled"] }
schemars = "1.2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
serde_yaml = "0.9"
sha2 = "0.10"
subtle = "2.6"
minijinja = { version = "2.12", features = ["json"] }
tempfile = "3.23"
thiserror = "2.0"
tokio = { version = "1.48", features = ["full"] }
tokio-util = "0.7"
tower = { version = "0.5", features = ["util"] }
toml = "0.9.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
jsonschema = { version = "0.26.2", default-features = false }
meerkat-llm-core = "=0.9.4"
meerkat-providers = { version = "=0.9.4", default-features = false }

# Bind the complete native graph to the recovery candidate, including Meta dependencies.
# Fugue qualifies these commits with its consumer checks; upstream CI is informational.
# Retire the temporary pins when a released pair passes the same Fugue acceptance.
[patch.crates-io]
meerkat-meta = { version = "=0.9.4", git = "https://github.com/lukacf/meerkat-meta.git", rev = "ba44bcb8cb03d0f9f04b4d17c46e3de04b1c46df" }
meerkat = { version = "=0.9.4", git = "https://github.com/lukacf/meerkat.git", rev = "79eae05d740fc4b60cc80f48d21b3dcd77a99916" }
meerkat-anthropic = { version = "=0.9.4", git = "https://github.com/lukacf/meerkat.git", rev = "79eae05d740fc4b60cc80f48d21b3dcd77a99916" }
meerkat-auth-core = { version = "=0.9.4", git = "https://github.com/lukacf/meerkat.git", rev = "79eae05d740fc4b60cc80f48d21b3dcd77a99916" }
meerkat-authorization = { version = "=0.9.4", git = "https://github.com/lukacf/meerkat.git", rev = "79eae05d740fc4b60cc80f48d21b3dcd77a99916" }
meerkat-authorization-contracts = { version = "=0.9.4", git = "https://github.com/lukacf/meerkat.git", rev = "79eae05d740fc4b60cc80f48d21b3dcd77a99916" }
meerkat-capabilities = { version = "=0.9.4", git = "https://github.com/lukacf/meerkat.git", rev = "79eae05d740fc4b60cc80f48d21b3dcd77a99916" }
meerkat-client = { version = "=0.9.4", git = "https://github.com/lukacf/meerkat.git", rev = "79eae05d740fc4b60cc80f48d21b3dcd77a99916" }
meerkat-comms = { version = "=0.9.4", git = "https://github.com/lukacf/meerkat.git", rev = "79eae05d740fc4b60cc80f48d21b3dcd77a99916" }
meerkat-contracts = { version = "=0.9.4", git = "https://github.com/lukacf/meerkat.git", rev = "79eae05d740fc4b60cc80f48d21b3dcd77a99916" }
meerkat-copilot = { version = "=0.9.4", git = "https://github.com/lukacf/meerkat.git", rev = "79eae05d740fc4b60cc80f48d21b3dcd77a99916" }
meerkat-core = { version = "=0.9.4", git = "https://github.com/lukacf/meerkat.git", rev = "79eae05d740fc4b60cc80f48d21b3dcd77a99916" }
meerkat-gemini = { version = "=0.9.4", git = "https://github.com/lukacf/meerkat.git", rev = "79eae05d740fc4b60cc80f48d21b3dcd77a99916" }
meerkat-hooks = { version = "=0.9.4", git = "https://github.com/lukacf/meerkat.git", rev = "79eae05d740fc4b60cc80f48d21b3dcd77a99916" }
meerkat-jobs = { version = "=0.9.4", git = "https://github.com/lukacf/meerkat.git", rev = "79eae05d740fc4b60cc80f48d21b3dcd77a99916" }
meerkat-live = { version = "=0.9.4", git = "https://github.com/lukacf/meerkat.git", rev = "79eae05d740fc4b60cc80f48d21b3dcd77a99916" }
meerkat-llm-core = { version = "=0.9.4", git = "https://github.com/lukacf/meerkat.git", rev = "79eae05d740fc4b60cc80f48d21b3dcd77a99916" }
meerkat-machine-derive = { version = "=0.9.4", git = "https://github.com/lukacf/meerkat.git", rev = "79eae05d740fc4b60cc80f48d21b3dcd77a99916" }
meerkat-machine-dsl = { version = "=0.9.4", git = "https://github.com/lukacf/meerkat.git", rev = "79eae05d740fc4b60cc80f48d21b3dcd77a99916" }
meerkat-machine-dsl-core = { version = "=0.9.4", git = "https://github.com/lukacf/meerkat.git", rev = "79eae05d740fc4b60cc80f48d21b3dcd77a99916" }
meerkat-machine-kernels = { version = "=0.9.4", git = "https://github.com/lukacf/meerkat.git", rev = "79eae05d740fc4b60cc80f48d21b3dcd77a99916" }
meerkat-machine-schema = { version = "=0.9.4", git = "https://github.com/lukacf/meerkat.git", rev = "79eae05d740fc4b60cc80f48d21b3dcd77a99916" }
meerkat-mcp = { version = "=0.9.4", git = "https://github.com/lukacf/meerkat.git", rev = "79eae05d740fc4b60cc80f48d21b3dcd77a99916" }
meerkat-memory = { version = "=0.9.4", git = "https://github.com/lukacf/meerkat.git", rev = "79eae05d740fc4b60cc80f48d21b3dcd77a99916" }
meerkat-mob = { version = "=0.9.4", git = "https://github.com/lukacf/meerkat.git", rev = "79eae05d740fc4b60cc80f48d21b3dcd77a99916" }
meerkat-mob-mcp = { version = "=0.9.4", git = "https://github.com/lukacf/meerkat.git", rev = "79eae05d740fc4b60cc80f48d21b3dcd77a99916" }
meerkat-models = { version = "=0.9.4", git = "https://github.com/lukacf/meerkat.git", rev = "79eae05d740fc4b60cc80f48d21b3dcd77a99916" }
meerkat-openai = { version = "=0.9.4", git = "https://github.com/lukacf/meerkat.git", rev = "79eae05d740fc4b60cc80f48d21b3dcd77a99916" }
meerkat-providers = { version = "=0.9.4", git = "https://github.com/lukacf/meerkat.git", rev = "79eae05d740fc4b60cc80f48d21b3dcd77a99916" }
meerkat-runtime = { version = "=0.9.4", git = "https://github.com/lukacf/meerkat.git", rev = "79eae05d740fc4b60cc80f48d21b3dcd77a99916" }
meerkat-sandbox = { version = "=0.9.4", git = "https://github.com/lukacf/meerkat.git", rev = "79eae05d740fc4b60cc80f48d21b3dcd77a99916" }
meerkat-schedule = { version = "=0.9.4", git = "https://github.com/lukacf/meerkat.git", rev = "79eae05d740fc4b60cc80f48d21b3dcd77a99916" }
meerkat-session = { version = "=0.9.4", git = "https://github.com/lukacf/meerkat.git", rev = "79eae05d740fc4b60cc80f48d21b3dcd77a99916" }
meerkat-skills = { version = "=0.9.4", git = "https://github.com/lukacf/meerkat.git", rev = "79eae05d740fc4b60cc80f48d21b3dcd77a99916" }
meerkat-sqlite = { version = "=0.9.4", git = "https://github.com/lukacf/meerkat.git", rev = "79eae05d740fc4b60cc80f48d21b3dcd77a99916" }
meerkat-store = { version = "=0.9.4", git = "https://github.com/lukacf/meerkat.git", rev = "79eae05d740fc4b60cc80f48d21b3dcd77a99916" }
meerkat-tools = { version = "=0.9.4", git = "https://github.com/lukacf/meerkat.git", rev = "79eae05d740fc4b60cc80f48d21b3dcd77a99916" }
meerkat-workgraph = { version = "=0.9.4", git = "https://github.com/lukacf/meerkat.git", rev = "79eae05d740fc4b60cc80f48d21b3dcd77a99916" }

# Keep the large generated platform crates inexpensive to link in the offline suite.
[profile.test]
debug = 0

# Meta's release profile is not inherited by downstream applications. These
# cold-path crates contain very large generated functions; optimizing them in
# LLVM can exhaust memory without improving this I/O-bound service.
[profile.release]
opt-level = 1

[profile.release.package.meerkat-machine-schema]
opt-level = 0

[profile.release.package.meerkat-core]
opt-level = 0

[profile.release.package.meerkat-runtime]
opt-level = 0

[profile.release.package.meerkat-mob]
opt-level = 0

[profile.release.package.meerkat-live]
opt-level = 0

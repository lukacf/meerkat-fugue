[package]
name = "meerkat-fugue"
version = "0.1.1"
edition = "2024"
rust-version = "1.94"
default-run = "meerkat-fugue"
license = "MIT OR Apache-2.0"
description = "Meerkat-powered issue automation and persistent repository teams."
repository = "https://github.com/lukacf/meerkat-fugue"
readme = "README.md"
keywords = ["agents", "automation", "meerkat", "linear"]
categories = ["development-tools"]

[dependencies]
anyhow = "1.0"
async-stream = "0.3"
async-trait = "0.1"
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
futures = "0.3"
indexmap = { version = "2", features = ["serde"] }
meerkat-contracts = "=0.9.14"
meerkat-core = "=0.9.14"
meerkat-models = "=0.9.14"
meerkat-mob = "=0.9.14"
meerkat-meta = "=0.9.14"
meerkat-runtime = "=0.9.14"
meerkat-tools = "=0.9.14"
meerkat = { version = "=0.9.14", features = ["workgraph"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "multipart"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
schemars = "1.2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
serde_yaml = "0.9"
sha2 = "0.10"
subtle = "2.6"
minijinja = { version = "2.12", features = ["json"] }
tempfile = "3.23"
thiserror = "2.0"
tokio = { version = "1.48", features = ["full"] }
tokio-util = "0.7"
tower = { version = "0.5", features = ["util"] }
toml = "0.9.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal", "process"] }

[dev-dependencies]
jsonschema = { version = "0.26.2", default-features = false }
meerkat-llm-core = "=0.9.14"
meerkat-providers = { version = "=0.9.14", default-features = false }

# Keep the large generated platform crates inexpensive to link in the offline suite.
[profile.test]
debug = 0

# Meta's release profile is not inherited by downstream applications. These
# cold-path crates contain very large generated functions; optimizing them in
# LLVM can exhaust memory without improving this I/O-bound service.
[profile.release]
opt-level = 1

[profile.release.package.meerkat-machine-schema]
opt-level = 0

[profile.release.package.meerkat-core]
opt-level = 0

[profile.release.package.meerkat-runtime]
opt-level = 0

[profile.release.package.meerkat-mob]
opt-level = 0

[profile.release.package.meerkat-live]
opt-level = 0

# Custom 0.9.14 native observer carry. Meta stays on its published 0.9.14 crate.
# Keep every Core crate, including transitive ones, at this exact revision.
[patch.crates-io]
meerkat = { git = "https://github.com/lukacf/meerkat", rev = "dc64d48ebe2f8f34290115fa87707aa4f58f77b5" }
meerkat-anthropic = { git = "https://github.com/lukacf/meerkat", rev = "dc64d48ebe2f8f34290115fa87707aa4f58f77b5" }
meerkat-auth-core = { git = "https://github.com/lukacf/meerkat", rev = "dc64d48ebe2f8f34290115fa87707aa4f58f77b5" }
meerkat-authorization = { git = "https://github.com/lukacf/meerkat", rev = "dc64d48ebe2f8f34290115fa87707aa4f58f77b5" }

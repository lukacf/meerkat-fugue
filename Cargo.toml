meerkat-capabilities = { git = "https://github.com/lukacf/meerkat", rev = "dc64d48ebe2f8f34290115fa87707aa4f58f77b5" }
meerkat-client = { git = "https://github.com/lukacf/meerkat", rev = "dc64d48ebe2f8f34290115fa87707aa4f58f77b5" }

name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  delivery:
    name: Delivery
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Test release safeguards
        run: |
          command -v lsof
          python3 -m unittest discover -s scripts/release -p 'test_*.py' -v
          python3 -m unittest discover -s scripts/distribution -p 'test_*.py' -v

      - name: Install browser dependencies
        run: npm ci && npx playwright install --with-deps chromium

      - name: Test Ensemble browser behavior
        run: npx playwright test tests/ensemble-dashboard-search.spec.mjs tests/first-run-setup.spec.mjs tests/issue-detail.spec.mjs tests/queue-directory.spec.mjs tests/navigation.spec.mjs tests/welcome.spec.mjs --project=chromium

  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check tracked publication hygiene
        run: scripts/public-readiness/scan.sh --current-only

      - name: Check formatting
        run: cargo fmt --check

      - name: Check
        run: cargo check --all-targets --locked

      - name: Test offline contracts and runtime
        timeout-minutes: 45
        run: cargo test --all-targets --locked

      - name: Repeat native handoff and restart contracts
        timeout-minutes: 15
        run: |
          for attempt in 1 2 3 4 5; do
            echo "Native restart qualification $attempt/5"
            cargo test --locked --lib native_flow_delivers_worker
          done

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

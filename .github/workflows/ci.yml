name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  delivery:
    name: Delivery
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install publication scan dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ripgrep
          rg --version

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Test release safeguards
        run: |
          command -v lsof
          npm run test:delivery

      - name: Install browser dependencies
        run: npm ci && npx playwright install --with-deps chromium

      - name: Test Ensemble browser behavior
        run: npm run test:ui

  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install publication scan dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ripgrep
          rg --version

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check tracked publication hygiene
        run: scripts/public-readiness/scan.sh --current-only

      - name: Check formatting
        run: cargo fmt --check

      - name: Check
        run: cargo check --all-targets --locked

      - name: Test offline contracts and runtime
        timeout-minutes: 45
        env:
          FUGUE_TEST_EVIDENCE_DIR: ${{ runner.temp }}/fugue-full-suite
        run: |
          mkdir -p "$FUGUE_TEST_EVIDENCE_DIR"
          cargo test --all-targets --locked

      - name: Locate the compiled native test executable
        timeout-minutes: 5
        run: cargo test --locked --lib --no-run --message-format=json-render-diagnostics > "$RUNNER_TEMP/fugue-native-tests.jsonl"

      - name: Repeat native handoff and restart contracts
        # Internal bounds total 22 minutes including cleanup; leave room for
        # cancellation, evidence finalization and artifact upload.
        timeout-minutes: 25
        run: python3 scripts/ci/repeat-native-tests.py "$RUNNER_TEMP/fugue-native-tests.jsonl" "$RUNNER_TEMP/fugue-retirement"

      - name: Retain native retirement evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-retirement-evidence
          path: |
            ${{ runner.temp }}/fugue-retirement/
            ${{ runner.temp }}/fugue-full-suite/
          if-no-files-found: ignore

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

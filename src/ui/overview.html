<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Home | Fugue</title></head><body>
<main id="portfolio" class="fugue-page" data-view="home">
  <div class="fugue-heading"><div><h1 id="portfolioTitle">Your work at a glance.</h1><p>Issues that need attention, active work and repository preparation.</p></div><a class="fugue-button" href="/ensemble#add">Add repository</a></div>
  <div class="portfolio-toolbar"><span id="portfolioStatus" role="status">Loading repositories...</span><button class="fugue-button" id="portfolioRetry">Refresh</button></div>
  <div id="portfolioError" class="fugue-message fugue-error" role="alert" hidden></div>
  <div class="portfolio-columns"><div><section aria-labelledby="attentionHeading"><h2 id="attentionHeading" class="portfolio-section-heading">Needs attention</h2><div id="portfolioAttention" class="fugue-panel"><div class="fugue-empty">Loading issue states...</div></div></section>
  <section aria-labelledby="workHeading"><h2 id="workHeading" class="portfolio-section-heading">Work in progress</h2><div id="portfolioRepositories" class="portfolio-repositories"><div class="fugue-panel fugue-empty">Loading boards...</div></div></section></div>
  <aside><section aria-labelledby="setupHeading"><h2 id="setupHeading" class="portfolio-section-heading">Setup and access</h2><div id="portfolioProblems" class="fugue-panel"><div class="fugue-empty">Checking repositories...</div></div></section><section aria-labelledby="recentHeading"><h2 id="recentHeading" class="portfolio-section-heading">Recently finished</h2><div id="portfolioRecent"><div class="fugue-empty">Loading recent work...</div></div></section></aside></div>
</main><script>__PORTFOLIO_JS__</script></body></html>
